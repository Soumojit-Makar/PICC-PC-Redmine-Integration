# ==============================================================================
# application-example.properties
# ------------------------------------------------------------------------------
# EXAMPLE configuration file for the Redmine Integration Service.
# Copy this file and rename it to match your target profile:
#
#   application-local.properties   -> for local development
#   application-main.properties    -> for production / staging
#
# Fill in the values below with your actual environment settings.
# NEVER commit files containing real credentials to source control.
# ==============================================================================

# ------------------------------------------------------------------------------
# Spring Cloud Config Server (optional)
# Leave empty to run in standalone mode using only local properties.
# Example: http://localhost:8888/config
# ------------------------------------------------------------------------------
spring.config.import=optional:configserver:

# ------------------------------------------------------------------------------
# Feign Client — Primary Redmine Instance
# Base URL of your Redmine installation (no trailing slash)
# Example: http://localhost:3000   or   http://redmine.example.com
# ------------------------------------------------------------------------------
feign.name=redmine-client
feign.url=http://localhost:3000

# ------------------------------------------------------------------------------
# Feign Client — Support Redmine Instance
# Can be the same URL as the primary instance if you only have one Redmine.
# Example: http://localhost:3000
# ------------------------------------------------------------------------------
feign.support.name=redmine-support-client
feign.support.url=http://localhost:3000

# ------------------------------------------------------------------------------
# Default Role ID for User-Project Membership Associations
#   1  = Non member
#   2  = Anonymous
#   3  = Manager
#   4  = Developer  (recommended default)
#   5  = Reporter
#   6  = DevOps-Architect
#   7  = Tech Lead
#   8  = DevOps-Engineer
# ------------------------------------------------------------------------------
redmine.role=4

# ------------------------------------------------------------------------------
# Server Port (default: 8080)
# ------------------------------------------------------------------------------
server.port=8080
