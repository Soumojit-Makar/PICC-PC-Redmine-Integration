# ==============================================================================
# PICC-PC-Redmine-Integration - Application Configuration
# ==============================================================================

# Server Configuration
server.port=${SERVER_PORT:8080}
spring.application.name=redmine-integration

# Active Profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:main}

# Feign Client — Primary Redmine Instance
feign.name=${FEIGN_NAME:redmine-client}
feign.url=${FEIGN_URL:http://localhost:3000}

# Feign Client — Support Redmine Instance
feign.support.name=${FEIGN_SUPPORT_NAME:redmine-support-client}
feign.support.url=${FEIGN_SUPPORT_URL:http://localhost:3000}

# Default Role ID for User-Project Membership Associations
# 1=Non member, 2=Anonymous, 3=Manager, 4=Developer, 5=Reporter, 6=DevOps-Architect, 7=Tech Lead, 8=DevOps-Engineer
redmine.role=${REDMINE_ROLE:4}

# Spring Cloud Config Server (Optional)
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}/nnp-config

# SpringDoc / Swagger OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
